<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1116" />
  <title>三宅DUNKS</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="ball" aria-hidden="true">🏀</span>
      <div>
        <h1>三宅DUNKS</h1>
        <p class="sub">ミニバスケットボール チーム管理</p>
      </div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab is-active" data-tab="practice" role="tab">練習メニュー</button>
    <button class="tab is-locked" data-tab="schedule" role="tab" disabled aria-disabled="true">スケジュール<span class="lock">🔒</span></button>
    <button class="tab is-locked" data-tab="sns" role="tab" disabled aria-disabled="true">SNS<span class="lock">🔒</span></button>
  </nav>

  <main>
    <!-- 練習メニュー -->
    <section id="practice" class="panel is-active">
      <div class="panel-head">
        <h2>練習メニュー</h2>
        <span class="updated" id="practice-updated"></span>
      </div>
      <div id="day-tabs" class="seg"></div>
      <div id="day-time" class="day-time"></div>
      <div id="practice-list"></div>
    </section>

    <!-- スケジュール（準備中・ロック） -->
    <section id="schedule" class="panel">
      <div class="locked-panel">
        <span class="locked-icon">🔒</span>
        <h2>スケジュール</h2>
        <p>このページは準備中です。<br>近日公開予定です。</p>
      </div>
    </section>

    <!-- SNS（準備中・ロック） -->
    <section id="sns" class="panel">
      <div class="locked-panel">
        <span class="locked-icon">🔒</span>
        <h2>SNS 投稿予定</h2>
        <p>このページは準備中です。<br>近日公開予定です。</p>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <footer class="app-footer">三宅DUNKS · GitHub Pages</footer>

  <script src="assets/app.js"></script>
</body>
</html>
